<script>
  document.addEventListener("DOMContentLoaded", function () {
    const menuToggle = document.getElementById("menuToggle");
    const navLinks = document.getElementById("navLinks");
    const pageLinks = Array.from(document.querySelectorAll(".page-link"));
    const pages = Array.from(document.querySelectorAll(".page"));
    const revealEls = Array.from(document.querySelectorAll(".reveal"));
    const glossary = document.getElementById("glossary");

    function updateGlossary(pageId) {
      if (!glossary) return;

      if (pageId === "projets-professionnels") {
        glossary.classList.add("visible");
      } else {
        glossary.classList.remove("visible");
      }
    }

    function showPage(pageId) {
      pages.forEach(function (page) {
        if (page.id === pageId) {
          page.classList.add("active-page");
          page.style.display = "block";
        } else {
          page.classList.remove("active-page");
          page.style.display = "none";
        }
      });

      pageLinks.forEach(function (link) {
        const isMenuLink = link.closest(".nav-links");
        if (isMenuLink && link.dataset.page === pageId) {
          link.classList.add("active");
        } else if (isMenuLink) {
          link.classList.remove("active");
        }
      });

      updateGlossary(pageId);

      if (navLinks) {
        navLinks.classList.remove("open");
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      history.replaceState(null, "", "#" + pageId);
    }

    if (menuToggle && navLinks) {
      menuToggle.addEventListener("click", function () {
        navLinks.classList.toggle("open");
      });
    }

    pageLinks.forEach(function (link) {
      link.addEventListener("click", function (event) {
        event.preventDefault();

        const pageId = link.dataset.page;

        if (pageId && document.getElementById(pageId)) {
          showPage(pageId);
        }
      });
    });

    revealEls.forEach(function (el) {
      el.classList.add("visible");
    });

    let initialPage = "accueil";

    if (window.location.hash) {
      const hashPage = window.location.hash.replace("#", "");

      if (document.getElementById(hashPage)) {
        initialPage = hashPage;
      }
    }

    showPage(initialPage);
  });
</script>
