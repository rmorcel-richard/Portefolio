<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Vercel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7efe5;
      color: #17324f;
      padding: 40px;
    }

    .box {
      max-width: 700px;
      margin: 0 auto;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(23, 50, 79, 0.15);
      text-align: center;
    }

    button {
      margin-top: 20px;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: #d96632;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #resultat {
      margin-top: 20px;
      font-weight: bold;
      color: #d96632;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Test du site Vercel</h1>

    <p>
      Si cette page s’affiche correctement, alors Vercel fonctionne.
    </p>

    <p>
      Clique sur le bouton pour tester JavaScript.
    </p>

    <button onclick="testerJS()">Tester JavaScript</button>

    <div id="resultat"></div>
  </div>

  <script>
    function testerJS() {
      document.getElementById("resultat").textContent =
        "JavaScript fonctionne correctement ✅";
    }

    console.log("Le fichier test.html est bien chargé.");
  </script>
</body>
</html>
