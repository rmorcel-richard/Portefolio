<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Portfolio - Richard Morcel</title>

<style>
  body{
    margin:0;
    padding:30px;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
    color:#17324f;
  }

  h1{
    margin-bottom:30px;
    font-size:2rem;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:40px;
  }

  .card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
  }

  .card h2{
    margin:0;
    font-size:2rem;
    color:#d96632;
  }

  .card p{
    margin-top:10px;
    color:#555;
    font-weight:bold;
  }

  table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
  }

  th{
    background:#17324f;
    color:white;
    padding:15px;
    text-align:left;
  }

  td{
    padding:12px 15px;
    border-bottom:1px solid #eee;
    font-size:0.95rem;
  }

  tr:hover{
    background:#f9f9f9;
  }

  .loading{
    font-size:1.2rem;
  }
</style>
</head>

<body>

<h1>Dashboard Portfolio — Richard Morcel</h1>

<div class="grid">

  <div class="card">
    <h2 id="visites">0</h2>
    <p>Visites portfolio</p>
  </div>

  <div class="card">
    <h2 id="navigations">0</h2>
    <p>Navigations</p>
  </div>

  <div class="card">
    <h2 id="projets">0</h2>
    <p>Clics projets personnels</p>
  </div>

  <div class="card">
    <h2 id="contacts">0</h2>
    <p>Clics contact</p>
  </div>

  <div class="card">
    <h2 id="mobiles">0</h2>
    <p>Visites mobile</p>
  </div>

  <div class="card">
    <h2 id="ordinateurs">0</h2>
    <p>Visites ordinateur</p>
  </div>

</div>

<h2>Dernières activités</h2>

<div class="loading" id="loading">
Chargement des données...
</div>

<table id="table" style="display:none;">
  <thead>
    <tr>
      <th>Date</th>
      <th>Événement</th>
      <th>Page</th>
      <th>Appareil</th>
      <th>Ville</th>
      <th>Pays</th>
    </tr>
  </thead>

  <tbody id="tbody"></tbody>
</table>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzJ_6fyBv-V6QisbpJBQOPZDrixr9BgJSx1Dh49lTaq4SL2qGx5JNZ2O6QuahkrgWJuig/exec";

async function chargerDashboard(){

  try{

    const response = await fetch(API_URL);
    const data = await response.json();

    document.getElementById("visites").textContent =
      data.stats.visites_portfolio;

    document.getElementById("navigations").textContent =
      data.stats.navigations;

    document.getElementById("projets").textContent =
      data.stats.clics_projets_personnels;

    document.getElementById("contacts").textContent =
      data.stats.clics_contact;

    document.getElementById("mobiles").textContent =
      data.stats.mobiles;

    document.getElementById("ordinateurs").textContent =
      data.stats.ordinateurs;

    const tbody = document.getElementById("tbody");

    data.rows.forEach(row => {

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${row.date || ""}</td>
        <td>${row.type_evenement || ""}</td>
        <td>${row.page || ""}</td>
        <td>${row.appareil || ""}</td>
        <td>${row.ville || ""}</td>
        <td>${row.pays || ""}</td>
      `;

      tbody.appendChild(tr);

    });

    document.getElementById("loading").style.display = "none";
    document.getElementById("table").style.display = "table";

  }catch(error){

    document.getElementById("loading").innerHTML =
      "Erreur de chargement du dashboard";

    console.log(error);

  }

}

chargerDashboard();

</script>

</body>
</html>
