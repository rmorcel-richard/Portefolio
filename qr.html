<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>QR Redirect</title>
</head>

<body>
<script>
  // 🔥 Heure de Paris
  const nowParis = new Date().toLocaleString("fr-FR", {
    timeZone: "Europe/Paris"
  });

  // 📱 Infos device
  const device = navigator.userAgent;

  // 📡 Envoi du log (optionnel mais recommandé)
  fetch("/api/log-scan", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      time: nowParis,
      device: device,
      page: "qr.html"
    })
  }).catch(err => {
    console.log("Erreur tracking QR :", err);
  });

  // 🚀 Redirection vers ton portfolio
  window.location.replace("https://portefolio-beta-ten.vercel.app/qr#accueil");
</script>

<noscript>
  <p>Redirection en cours... Si rien ne se passe, cliquez ici :</p>
  <a href="https://portefolio-beta-ten.vercel.app/qr#accueil">
    Accéder au portfolio
  </a>
</noscript>

</body>
</html>
